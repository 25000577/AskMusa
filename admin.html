<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Control Center — Xcelerate MathsAcademy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0e1525;
  --surface: #1a2440;
  --surface-line: rgba(243,238,223,0.10);
  --chalk: #f4efe1;
  --chalk-dim: #b7c0d6;
  --amber: #ffb627;
  --teal: #36c2b4;
  --coral: #ff6b5b;
  --green: #4ade80;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #0e1525;
  color: var(--chalk);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
}
h1, h2 { font-family: 'Space Grotesk', sans-serif; margin: 0; }
.login-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.login-card {
  background: var(--surface);
  border: 1px solid var(--surface-line);
  border-radius: 12px;
  padding: 40px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
}
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.field label { font-size: 0.8rem; color: var(--chalk-dim); }
.field input {
  background: #141d33;
  border: 1px solid var(--surface-line);
  border-radius: 6px;
  padding: 12px;
  color: var(--chalk);
  font-size: 0.95rem;
}
.field input:focus { outline: none; border-color: var(--amber); }
.btn {
  width: 100%;
  padding: 12px;
  background: var(--amber);
  color: var(--ink);
  font-weight: 700;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
.error-box {
  background: rgba(255,107,91,0.15);
  border: 1px solid var(--coral);
  border-radius: 6px;
  padding: 10px;
  font-size: 0.85rem;
  color: var(--coral);
  margin-bottom: 14px;
  display: none;
}
.app { display: none; padding: 30px; max-width: 1200px; margin: 0 auto; }
.panel { background: var(--surface); border: 1px solid var(--surface-line); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--surface-line); }
th { color: var(--chalk-dim); font-size: 0.75rem; text-transform: uppercase; }
.logout-btn { background: none; border: 1px solid var(--coral); color: var(--coral); padding: 6px 12px; border-radius: 6px; cursor: pointer; float: right; }
</style>
</head>
<body>

<!-- Login Form -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <h1>Owner Control</h1>
    <p style="color:var(--chalk-dim);font-size:0.85rem;margin-bottom:20px;">Sign in to view learner logs and activity.</p>
    <div class="error-box" id="loginError"></div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="adminEmail" value="vutlharikhumalo@gmail.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="adminPassword" value="Xcelerate2026!">
    </div>
    <button class="btn" onclick="doLogin()">Sign In</button>
  </div>
</div>

<!-- Main App Dashboard -->
<div class="app" id="appWrap">
  <button class="logout-btn" onclick="doLogout()">Log Out</button>
  <h1>Owner Dashboard</h1>
  <p style="color:var(--chalk-dim);margin-bottom:20px;">Live platform tracking & activity monitor.</p>

  <div class="panel">
    <h2>Activity Feed</h2>
    <div id="feedList" style="margin-top:10px;font-size:0.85rem;color:var(--chalk-dim);">Loading feed...</div>
  </div>

  <div class="panel">
    <h2>Registered Learners</h2>
    <table>
      <thead>
        <tr><th>Name</th><th>Email</th><th>Tier</th><th>Verified</th><th>Joined</th></tr>
      </thead>
      <tbody id="userTableBody">
        <tr><td colspan="5">Loading learners...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const API = ''; // relative url to backend
let token = localStorage.getItem('xm_admin_token');

async function doLogin() {
  const email = document.getElementById('adminEmail').value.trim();
  const password = document.getElementById('adminPassword').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';

  try {
    const res = await fetch(`${API}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (!res.ok || !data.user?.is_admin) {
      errEl.textContent = data.error || 'Admin access required.';
      errEl.style.display = 'block';
    } else {
      token = data.token;
      localStorage.setItem('xm_admin_token', token);
      showDashboard();
    }
  } catch (err) {
    errEl.textContent = 'Connection error to backend server.';
    errEl.style.display = 'block';
  }
}

function doLogout() {
  localStorage.removeItem('xm_admin_token');
  token = null;
  document.getElementById('appWrap').style.display = 'none';
  document.getElementById('loginWrap').style.display = 'flex';
}

function showDashboard() {
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('appWrap').style.display = 'block';
  loadAdminData();
}

async function loadAdminData() {
  try {
    // Load Feed
    const feedRes = await fetch(`${API}/api/admin/feed`, { headers: { 'Authorization': `Bearer ${token}` } });
    const feedData = await feedRes.json();
    const feedEl = document.getElementById('feedList');
    if (feedData.feed && feedData.feed.length > 0) {
      feedEl.innerHTML = feedData.feed.map(e => `<div><b>${e.name}</b> (${e.email}) — ${e.event_type} at ${new Date(e.created_at).toLocaleTimeString()}</div>`).join('');
    } else {
      feedEl.innerHTML = 'No activity recorded yet.';
    }

    // Load Learners
    const userRes = await fetch(`${API}/api/admin/learners`, { headers: { 'Authorization': `Bearer ${token}` } });
    const userData = await userRes.json();
    const tbody = document.getElementById('userTableBody');
    if (userData.learners && userData.learners.length > 0) {
      tbody.innerHTML = userData.learners.map(u => `
        <tr>
          <td>${u.name}</td>
          <td>${u.email}</td>
          <td>${u.tier}</td>
          <td>${u.email_verified ? 'Yes' : 'No'}</td>
          <td>${new Date(u.created_at).toLocaleDateString()}</td>
        </tr>
      `).join('');
    } else {
      tbody.innerHTML = '<tr><td colspan="5">No learners found.</td></tr>';
    }
  } catch (err) {
    console.error('Failed to load admin data', err);
  }
}

// Auto-check token on startup
if (token) {
  showDashboard();
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Xcelerate MathsAcademy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0e1525;
  --ink-soft: #141d33;
  --surface: #1a2440;
  --surface-soft: #22305a;
  --surface-line: rgba(243,238,223,0.10);
  --chalk: #f4efe1;
  --chalk-dim: #b7c0d6;
  --chalk-faint: #7b86a3;
  --amber: #ffb627;
  --amber-soft: rgba(255,182,39,0.14);
  --teal: #36c2b4;
  --teal-soft: rgba(54,194,180,0.14);
  --coral: #ff6b5b;
  --coral-soft: rgba(255,107,91,0.14);
  --violet: #9b8cff;
  --green: #4ade80;
  --green-soft: rgba(74,222,128,0.14);
  --radius-lg: 18px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --font-display: "Space Grotesk", sans-serif;
  --font-body: "Inter", sans-serif;
  --font-mono: "IBM Plex Mono", monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(circle at 12% -10%, #1c2747 0%, var(--ink) 55%);
  color: var(--chalk);
  font-family: var(--font-body);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
h1,h2,h3 { font-family: var(--font-display); margin: 0; }
p { margin: 0; }
button { font-family: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }

/* ---- Login ---- */
.login-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.login-card {
  background: var(--surface);
  border: 1px solid var(--surface-line);
  border-radius: var(--radius-lg);
  padding: 40px 44px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 32px 80px rgba(0,0,0,0.6);
}
.login-card h1 { font-size: 1.5rem; margin-bottom: 6px; }
.login-card p  { color: var(--chalk-dim); font-size: 0.86rem; margin-bottom: 26px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.field label { font-size: 0.79rem; color: var(--chalk-dim); font-weight: 500; }
.field input {
  background: var(--ink-soft);
  border: 1px solid var(--surface-line);
  border-radius: var(--radius-sm);
  padding: 11px 13px;
  color: var(--chalk);
  font-size: 0.9rem;
}
.field input:focus { outline: none; border-color: var(--amber); }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.88rem; font-weight: 600;
  padding: 10px 20px; border-radius: 999px;
  border: 1px solid transparent; cursor: pointer;
  transition: transform 0.15s, opacity 0.15s;
}
.btn:hover { transform: translateY(-1px); }
.btn--primary { background: var(--amber); color: var(--ink); }
.btn--ghost   { background: transparent; color: var(--chalk); border-color: var(--surface-line); }
.btn--ghost:hover { background: var(--surface-soft); }
.btn--danger  { background: var(--coral-soft); color: var(--coral); border-color: var(--coral); }
.btn--sm { padding: 6px 14px; font-size: 0.78rem; }
.btn--full { width: 100%; justify-content: center; }
.error-box {
  background: var(--coral-soft); border: 1px solid var(--coral);
  border-radius: var(--radius-sm); padding: 10px 14px;
  font-size: 0.83rem; color: var(--coral); margin-bottom: 14px; display: none;
}

/* ---- App shell ---- */
.app { display: none; }
.sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: 220px;
  background: var(--surface);
  border-right: 1px solid var(--surface-line);
  display: flex; flex-direction: column;
  z-index: 20;
}
.sidebar__logo {
  padding: 22px 20px 18px;
  border-bottom: 1px solid var(--surface-line);
}
.sidebar__logo span {
  font-family: var(--font-display);
  font-size: 0.95rem; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
}
.sidebar__logo em { color: var(--amber); font-style: normal; }
.sidebar__admin-badge {
  font-family: var(--font-mono);
  font-size: 0.65rem; color: var(--coral);
  border: 1px solid var(--coral);
  border-radius: 5px; padding: 2px 7px;
  margin-top: 5px; display: inline-block;
}
.sidebar nav { flex: 1; padding: 16px 10px; display: flex; flex-direction: column; gap: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 9px;
  font-size: 0.87rem; color: var(--chalk-dim);
  background: transparent; border: none; text-align: left; width: 100%;
  transition: background 0.15s, color 0.15s;
}
.nav-item:hover { background: var(--surface-soft); color: var(--chalk); }
.nav-item.active { background: var(--amber-soft); color: var(--amber); font-weight: 600; }
.nav-item__icon { font-size: 1rem; width: 20px; text-align: center; }
.sidebar__footer {
  padding: 16px 10px;
  border-top: 1px solid var(--surface-line);
}

.main { margin-left: 220px; padding: 32px 36px 80px; }
.page { display: none; }
.page.active { display: block; }

.page-head { margin-bottom: 28px; }
.page-head h1 { font-size: 1.7rem; }
.page-head p  { color: var(--chalk-dim); font-size: 0.9rem; margin-top: 4px; }

/* ---- Stat cards ---- */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 28px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--surface-line);
  border-radius: var(--radius-md);
  padding: 20px 22px;
}
.stat-card__label { font-size: 0.76rem; color: var(--chalk-faint); text-transform: uppercase; letter-spacing: 0.06em; }
.stat-card__value { font-family: var(--font-display); font-size: 2rem; font-weight: 700; margin: 4px 0 2px; }
.stat-card__sub   { font-size: 0.78rem; color: var(--chalk-dim); }
.stat-card--green .stat-card__value  { color: var(--green); }
.stat-card--amber .stat-card__value  { color: var(--amber); }
.stat-card--teal  .stat-card__value  { color: var(--teal); }
.stat-card--coral .stat-card__value  { color: var(--coral); }

/* ---- Panel ---- */
.panel {
  background: var(--surface);
  border: 1px solid var(--surface-line);
  border-radius: var(--radius-lg);
  padding: 24px;
  margin-bottom: 20px;
}
.panel__head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px; gap: 12px;
}
.panel__head h2 { font-size: 1.05rem; }
.panel__tag { font-family: var(--font-mono); font-size: 0.7rem; color: var(--chalk-faint); }

.two-col { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }

/* ---- Table ---- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
th { text-align: left; padding: 8px 12px; font-size: 0.72rem; color: var(--chalk-faint); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--surface-line); }
td { padding: 10px 12px; border-bottom: 1px solid rgba(243,238,223,0.05); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,0.02); }

.badge {
  display: inline-block; font-size: 0.68rem; font-weight: 700;
  padding: 2px 8px; border-radius: 999px;
  font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.04em;
}
.badge--free    { background: var(--surface-soft); color: var(--chalk-dim); }
.badge--plus    { background: var(--amber-soft); color: var(--amber); }
.badge--pro     { background: var(--teal-soft); color: var(--teal); }
.badge--active  { background: var(--green-soft); color: var(--green); }
.badge--pending { background: var(--amber-soft); color: var(--amber); }
.badge--failed  { background: var(--coral-soft); color: var(--coral); }
.badge--none    { background: var(--surface-soft); color: var(--chalk-faint); }
.badge--verified   { background: var(--green-soft); color: var(--green); }
.badge--unverified { background: var(--coral-soft); color: var(--coral); }

/* ---- Feed ---- */
.feed { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; }
.feed-item {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 10px 12px;
  background: var(--surface-soft);
  border-radius: var(--radius-sm);
  font-size: 0.83rem;
}
.feed-item__icon { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }
.feed-item__body { flex: 1; }
.feed-item__who  { font-weight: 600; }
.feed-item__time { color: var(--chalk-faint); font-family: var(--font-mono); font-size: 0.7rem; margin-top: 2px; }

/* ---- Revenue chart (CSS bars) ---- */
.bar-chart { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: flex; align-items: center; gap: 10px; font-size: 0.82rem; }
.bar-row__label { width: 80px; color: var(--chalk-dim); flex-shrink: 0; }
.bar-row__track { flex: 1; height: 8px; background: var(--surface-soft); border-radius: 99px; overflow: hidden; }
.bar-row__fill  { height: 100%; border-radius: 99px; transition: width 0.6s ease; }
.bar-row__val   { width: 50px; text-align: right; font-family: var(--font-mono); font-size: 0.78rem; color: var(--chalk-dim); }

/* ---- PayFast setup guide ---- */
.setup-step {
  display: flex; gap: 16px; align-items: flex-start;
  background: var(--surface-soft);
  border-radius: var(--radius-md);
  padding: 18px;
  margin-bottom: 12px;
}
.setup-step__num {
  width: 32px; height: 32px; flex-shrink: 0;
  background: var(--amber-soft); color: var(--amber);
  border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; font-size: 0.9rem;
}
.setup-step__body h4 { font-size: 0.92rem; margin-bottom: 4px; }
.setup-step__body p  { font-size: 0.83rem; color: var(--chalk-dim); line-height: 1.55; }
.setup-step__body a  { color: var(--amber); text-decoration: underline; }

.env-block {
  background: var(--ink-soft);
  border: 1px solid var(--surface-line);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--teal);
